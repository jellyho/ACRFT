exclude: third_party/

repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version. Must emit lockfile revision 3 to match the committed uv.lock (older uv
    # rewrites it to an earlier schema); keep in step with the uv used to update deps.
    rev: 0.8.17
    hooks:
      - id: uv-lock
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version.
    rev: v0.8.6
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      - id: ruff-format