[project]
name = "openpi"
version = "0.1.0"
description = "Physical Intelligence open source repo"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
dependencies = [
    "augmax>=0.3.4",
    "dm-tree>=0.1.8",
    "einops>=0.8.0",
    "equinox>=0.11.8",
    "flatbuffers>=24.3.25",
    "flax==0.10.2",
    "fsspec[gcs]>=2024.6.0",
    "gym-aloha>=0.1.1",
    "imageio>=2.36.1",
    "jax[cuda12]==0.5.3",
    "jaxtyping==0.2.36",
    "lerobot==0.4.4",
    "ml_collections==1.0.0",
    "numpy>=2.0.0,<2.3.0",
    "numpydantic>=1.6.6",
    "opencv-python>=4.10.0.84",
    "openpi-client",
    "orbax-checkpoint==0.11.13",
    "pillow>=11.0.0",
    "sentencepiece>=0.2.0",
    "torch==2.7.1",
    "tqdm-loggable>=0.2",
    "typing-extensions>=4.12.2",
    "tyro>=0.9.5",
    "wandb>=0.19.1",
    "filelock>=3.16.1",
    "beartype==0.19.0",
    "chex==0.1.90",
    "treescope>=0.1.7",
    "transformers==4.53.2",
    "rich>=14.0.0",
    "polars>=1.30.0",
    "plotly>=6.9.0",
    "scikit-learn>=1.9.0",
    "umap-learn>=0.5.12",
]


[project.urls]
Repository = "https://github.com/Physical-Intelligence/openpi"

[dependency-groups]
dev = [
    "pytest>=8.3.4",
    "ruff>=0.8.6",
    "pre-commit>=4.0.1",
    "ipykernel>=6.29.5",
    "ipywidgets>=8.1.5",
    "matplotlib>=3.10.0",
    "pynvml>=12.0.0",
]
# RoboCasa sim rollout client (examples/robocasa/main.py, run_eval.sh). Install with
# `uv sync --group eval`. robocasa itself is used from third_party/robocasa via PYTHONPATH
# (not installed). numpy is pinned to the exact version robocasa asserts at import.
eval = [
    # RoboCasa 365 needs robosuite's `robocasa-dev` branch (adds load_model_on_init / lite_physics
    # used by robocasa's kitchen env); the PyPI 1.5.2 release and current master lack it.
    "robosuite @ git+https://github.com/ARISE-Initiative/robosuite.git@7736d3248abba04abe00b5c3882c4059ed08ce1b",
    "mujoco==3.3.1",
    "numpy==2.2.5",
    "h5py>=3.0",
]
# NOTE: The DROID/RLDS group was removed from the main workspace when migrating to
# LeRobot dataset format v3.0 (lerobot 0.4.4). v3.0 requires numpy>=2 (via rerun-sdk),
# but the RLDS stack depends on `dlimp`, which hard-pins `tensorflow==2.15.0` (numpy<2).
# These cannot be resolved in a single lockfile. To use DROID/RLDS, create a separate
# legacy venv, e.g.:
#     uv venv --python 3.11 .venv-rlds && source .venv-rlds/bin/activate
#     uv pip install "tensorflow-cpu==2.15.0" "tensorflow-datasets==4.9.9" \
#         "git+https://github.com/kvablack/dlimp@ad72ce3a9b414db2185bc0b38461d4101a65477a"

[tool.uv]
# numpy override: robosuite's `mink` dep pins numpy<2, but robocasa (eval group) needs numpy
# 2.2.5. mink is only used for whole-body IK, which the PandaOmron OSC_POSE controller doesn't
# use, so forcing numpy 2.2.5 is safe (robosuite runs fine on numpy 2.x — cf. the debs env).
override-dependencies = ["ml-dtypes==0.4.1", "tensorstore==0.1.74", "numpy==2.2.5"]

[tool.uv.sources]
openpi-client = { workspace = true }

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
line-length = 120
target-version = "py311"
# misc/ is analysis tooling carried over from the robot repo, written to its lint rules;
# excluded rather than rewritten so it stays diffable against where it came from.
extend-exclude = ["docker", "third_party", "src/openpi/models_pytorch/transformers_replace/*", "misc"]

[tool.ruff.lint]
# https://docs.astral.sh/ruff/rules/
select = [
    "B",
    "C4",
    "DTZ",
    "E4",
    "E7",
    "E9",
    "F",
    "FBT",
    "FURB",
    "I",
    "ICN",
    "ISC",
    "LOG",
    "N",
    "PD",
    "PERF",
    "PIE",
    "PLC",
    "PLE",
    "PLR1",
    "PLR5",
    "PLW",
    "PT",
    "Q",
    "RET",
    "RUF",
    "SIM",
    "SLF",
    "T10",
    "T20",
    "UP",
    "W",
]
ignore = [
    "F722",   # Conflicts with array typing.
    "T201",   # We use print statements.
    "PD008",  # Lots of false positives.
    "ISC001", # Disabling to support ruff format.
    "LOG015", # Use logger.info.
    "N806",   # Capitalised locals (M, N, T, ...) are standard for matrix/tensor dims in ML code.
    "RUF001", # We use unicode math (≈, ≫, →, ...) in comments/docstrings/wandb descriptions.
    "RUF002", # Same, in docstrings.
    "SLF001", # We deliberately call framework internals (e.g. env._check_success()).
]
unfixable = [
    "B905", # Fix defaults to strict=False, which is not what we want.
]

[tool.ruff.lint.isort]
force-single-line = true
force-sort-within-sections = true
single-line-exclusions = ["collections.abc", "typing", "typing_extensions"]
known-third-party = ["wandb"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
markers = ["manual: should be run manually."]
testpaths = ["src", "scripts", "packages"]
